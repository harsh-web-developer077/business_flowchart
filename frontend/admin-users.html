<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin - User Tracking Panel">
    <title>Admin - Registered Users</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #0891b2;
            --secondary: #f97316;
            --accent: #a855f7;
            --bg: #f0f9ff;
            --bg-card: #ffffff;
            --text-primary: #0c2340;
            --text-secondary: #475569;
            --border: #e0f2fe;
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --primary: #06b6d4;
                --secondary: #fb923c;
                --accent: #d946ef;
                --bg: #0f172a;
                --bg-card: #1e293b;
                --text-primary: #f1f5f9;
                --text-secondary: #cbd5e1;
                --border: #0e7490;
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --primary: #06b6d4;
            --secondary: #fb923c;
            --accent: #d946ef;
            --bg: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #0e7490;
            color-scheme: dark;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            background: var(--bg);
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            color: var(--primary);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 8px;
            border: 2px solid var(--border);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .table-container {
            background: var(--bg-card);
            border-radius: 8px;
            border: 2px solid var(--border);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--primary);
            color: white;
            padding: 1rem;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        tr:hover {
            background: rgba(8, 145, 178, 0.05);
        }

        .btn-group {
            display: flex;
            gap: 1rem;
        }

        button {
            padding: 0.7rem 1.2rem;
            border: 2px solid var(--primary);
            background: var(--primary);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        button:hover {
            background: var(--secondary);
            border-color: var(--secondary);
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary);
        }

        .btn-secondary:hover {
            background: rgba(8, 145, 178, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .back-link {
            margin-top: 2rem;
            display: inline-block;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .back-link:hover {
            color: var(--secondary);
        }

        .success-msg {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
        }

        .success-msg.show {
            display: block;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            th, td {
                padding: 0.7rem;
                font-size: 0.9rem;
            }

            .btn-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👥 Registered Users</h1>
            <div class="btn-group">
                <button onclick="exportData()">📥 Export CSV</button>
                <button class="btn-secondary" onclick="goBack()">← Back</button>
            </div>
        </div>

        <div class="success-msg" id="successMsg">✅ Data copied to clipboard!</div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalUsers">0</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="todayUsers">0</div>
                <div class="stat-label">Today Signups</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="thisWeekUsers">0</div>
                <div class="stat-label">This Week</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="thisMonthUsers">0</div>
                <div class="stat-label">This Month</div>
            </div>
        </div>

        <div class="table-container">
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Signup Date</th>
                        <th>Last Login</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="5" class="empty-state">Loading users...</td></tr>
                </tbody>
            </table>
        </div>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script>
        function loadUsers() {
            try {
                const users = JSON.parse(localStorage.getItem('bizcalc_registered_users') || '[]');
                const tableBody = document.getElementById('tableBody');

                if (users.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5" class="empty-state">❌ No registered users yet</td></tr>';
                    updateStats([]);
                    return;
                }

                // Sort by signup date (newest first)
                users.sort((a, b) => new Date(b.signupDate) - new Date(a.signupDate));

                let html = '';
                users.forEach((user, index) => {
                    const signupDate = new Date(user.signupDate).toLocaleString('en-IN');
                    const lastLogin = new Date(user.lastLogin).toLocaleString('en-IN');
                    html += `
                        <tr>
                            <td>${index + 1}</td>
                            <td><strong>${user.name || 'N/A'}</strong></td>
                            <td>${user.email}</td>
                            <td>${signupDate}</td>
                            <td>${lastLogin}</td>
                        </tr>
                    `;
                });

                tableBody.innerHTML = html;
                updateStats(users);
            } catch (e) {
                console.error('Error loading users:', e);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" class="empty-state">❌ Error loading data</td></tr>';
            }
        }

        function updateStats(users) {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
            const monthAgo = new Date(now.getFullYear(), now.getMonth(), 1);

            const todayCount = users.filter(u => new Date(u.signupDate) >= today).length;
            const weekCount = users.filter(u => new Date(u.signupDate) >= weekAgo).length;
            const monthCount = users.filter(u => new Date(u.signupDate) >= monthAgo).length;

            document.getElementById('totalUsers').textContent = users.length;
            document.getElementById('todayUsers').textContent = todayCount;
            document.getElementById('thisWeekUsers').textContent = weekCount;
            document.getElementById('thisMonthUsers').textContent = monthCount;
        }

        function exportData() {
            try {
                const users = JSON.parse(localStorage.getItem('bizcalc_registered_users') || '[]');

                if (users.length === 0) {
                    alert('No users to export');
                    return;
                }

                // Create CSV
                let csv = 'Name,Email,Signup Date,Last Login\n';
                users.forEach(user => {
                    const signupDate = new Date(user.signupDate).toLocaleString('en-IN');
                    const lastLogin = new Date(user.lastLogin).toLocaleString('en-IN');
                    csv += `"${user.name || 'N/A'}","${user.email}","${signupDate}","${lastLogin}"\n`;
                });

                // Copy to clipboard
                navigator.clipboard.writeText(csv).then(() => {
                    const msg = document.getElementById('successMsg');
                    msg.classList.add('show');
                    setTimeout(() => msg.classList.remove('show'), 2000);
                });
            } catch (e) {
                alert('Error exporting data: ' + e.message);
            }
        }

        function goBack() {
            window.history.back();
        }

        // Load on page load
        window.addEventListener('DOMContentLoaded', loadUsers);

        // Refresh every 5 seconds
        setInterval(loadUsers, 5000);
    </script>
</body>
</html>
